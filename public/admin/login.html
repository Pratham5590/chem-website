<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Devyani Pawar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" href="../images/image (2).png">
  <script src="/admin/login.js" defer></script>
</head>
<body>
  <header class="admin-shell brand">
    <span class="brand-name">Devyani Pawar</span>
    <span class="brand-subtitle">Chemistry Educator</span>
  </header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <span class="eyebrow">Private administration</span>
      <h1 id="login-title">Welcome back.</h1>
      <p class="subtle">Sign in to review website enquiries.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" maxlength="100" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <button class="primary-button" id="login-button" type="submit">SIGN IN <span aria-hidden="true">↗</span></button>
        <p id="login-status" class="status-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <p class="private-note">Authorized access only</p>
    <div class="back-to-website">
      <a class="return-button" href="/" target="_self" rel="noopener">Go to website ↗</a>
    </div>
  </main>
</body>
</html>
